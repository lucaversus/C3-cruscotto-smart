[env:esp32-hw394-logger]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; C++14 enables compile-time execution of the calendar regression checks.
build_unflags = -std=gnu++11
build_flags = -std=gnu++14 -Wall -Wextra
