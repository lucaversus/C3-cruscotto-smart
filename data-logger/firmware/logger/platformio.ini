[platformio]
default_envs = esp32-hw394-logger

[env]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; C++14 enables compile-time execution of the calendar regression checks.
build_unflags = -std=gnu++11
build_flags = -std=gnu++14 -Wall -Wextra
lib_deps =
  https://github.com/greiman/SdFat/archive/cda057318bec196183d4cc92b01bc1dd64bbfb02.zip
  https://github.com/olikraus/U8g2_Arduino/archive/b3a40de8822187c941b40cbbaaa77604a7ab90c7.zip

[env:esp32-hw394-logger]
; Full SD/RTC/OLED/STOP, vehicle interfaces inactive for USB bench setup.

[env:esp32-hw394-vehicle]
build_flags = ${env.build_flags} -DLOGGER_ENABLE_KWP=1 -DLOGGER_ENABLE_VAN=1
; KWP fast init and passive VAN COMFORT 125 kbit/s profile, not vehicle-validated.
