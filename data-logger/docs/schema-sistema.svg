<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380"><title>C3 — architettura del data logger</title><desc>Schema funzionale preliminare. Non è uno schema di cablaggio. Pin, alimentazioni e interfacce da verificare.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#64748b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#152b40}.t{font-size:28px;font-weight:700}.b{font-size:20px}.n{font-size:18px}.wire{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#a)}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}</style><rect width="1600" height="1380" fill="#f1f5f9"/><text x="50" y="55" class="t">CITROËN C3 · DATA LOGGER ESP32</text><text x="50" y="90" class="b">Architettura completa prevista · revisione preliminare · 18 ottobre 2026</text><rect x="50" y="110" width="1500" height="55" rx="10" fill="#fff0ce"/><text x="70" y="145" class="b">SCHEMA FUNZIONALE — non usare per cablare: pin, moduli, tensioni e protezioni non ancora definiti.</text>
<rect x="50" y="205" width="360" height="145" rx="14" class="box"/>
<text x="70" y="240" class="t">AUTO · presa OBD</text>
<text x="70" y="272" class="n">Diagnostica: CAN indicato dal lettore</text>
<text x="70" y="299" class="n">Bitrate e ID 11/29 bit da verificare</text>
<text x="70" y="326" class="n">Piedinatura sulla vettura da verificare</text>
<rect x="50" y="420" width="360" height="145" rx="14" class="box"/>
<text x="70" y="455" class="t">AUTO · rete BSI</text>
<text x="70" y="487" class="n">Protocollo e punto di accesso ignoti</text>
<text x="70" y="514" class="n">Acquisizione iniziale solo passiva</text>
<text x="70" y="541" class="n">Non presumere che sia CAN</text>
<rect x="490" y="205" width="400" height="145" rx="14" class="box"/>
