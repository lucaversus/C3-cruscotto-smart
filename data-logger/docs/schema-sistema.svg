<text x="50" y="1060" class="n">Verde = componente / prova verificati. Tratteggio = relazione prevista, non cablaggio approvato.</text><text x="50" y="1087" class="n">ESP32 verificato; CAN presente da verificare; SD / RTC / OLED ordinati. USB e alimentazione auto: coesistenza da progettare prima dell’uso.</text><g id="cartiglio"><rect x="25" y="25" width="1550" height="1330" fill="none" stroke="#172b42" stroke-width="2"/><rect x="600" y="1175" width="975" height="180" fill="white" stroke="#172b42" stroke-width="2"/><path d="M600 1223 H1575 M600 1269 H1575 M600 1315 H1575 M1100 1269 V1355 M1280 1269 V1355" fill="none" stroke="#263b50" stroke-width="2.5"/><text x="616" y="1207" font-family="Arial,sans-serif" font-size="27" fill="#172b42" font-weight="bold">Cruscotto C3+AI</text><text x="616" y="1254" font-family="Arial,sans-serif" font-size="23" fill="#172b42">Sottoprogetto: Data Logger</text><text x="616" y="1300" font-family="Arial,sans-serif" font-size="20" fill="#172b42" font-weight="bold">Architettura funzionale del sistema</text><text x="1115" y="1300" font-family="Arial,sans-serif" font-size="23" fill="#172b42" font-weight="bold">REV. C</text><text x="1295" y="1300" font-family="Arial,sans-serif" font-size="22" fill="#172b42">18/10/2026</text><text x="616" y="1343" font-family="Arial,sans-serif" font-size="21" fill="#172b42">Codice: C3AI-DL-BL-001</text><text x="1115" y="1343" font-family="Arial,sans-serif" font-size="19" fill="#172b42">Foglio 1/1</text><text x="1295" y="1343" font-family="Arial,sans-serif" font-size="16" fill="#172b42">PRELIMINARE · NON VALIDATO</text></g></svg>