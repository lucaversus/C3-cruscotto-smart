rif" font-size="21" fill="#172b42" font-weight="700">RX_3V3</text><text x="1415" y="332" font-family="Arial,sans-serif" font-size="18" fill="#172b42" font-weight="400">1</text><text x="1320" y="420" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="700">U1A · LM2903B</text><text x="1300" y="456" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">Pin 8 = +5V ; pin 4 = GND</text><text x="1300" y="486" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">Uscita open collector</text><text x="70" y="720" font-family="Arial,sans-serif" font-size="26" fill="#172b42" font-weight="700">C · Riferimento e alimentazione</text><text x="120" y="775" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="700">VBENCH</text><path d="M160 790 V805" stroke="#263b50" stroke-width="3" fill="none"/><path d="M160 805 v15 m0 50 v15" stroke="#263b50" stroke-width="3" fill="none"/><rect x="150" y="820" width="20" height="50" fill="white" stroke="#263b50" stroke-width="3"/><text x="179" y="839" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">R6</text><text x="179" y="865" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">150 kΩ</text><path d="M160 885 V915 H360" stroke="#263b50" stroke-width="3" fill="none"/><circle cx="160" cy="915" r="5" fill="#263b50"/><text x="275" y="897" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="700">VREF</text><path d="M160 915 V945" stroke="#263b50" stroke-width="3" fill="none"/><path d="M160 945 v15 m0 50 v15" stroke="#263b50" stroke-width="3" fill="none"/><rect x="150" y="960" width="20" height="50" fill="white" stroke="#263b50" stroke-width="3"/><text x="179" y="979" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">R7</text><text x="179" y="1005" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">10 kΩ</text><path d="M160 1025 V1040" stroke="#263b50" stroke-width="3" fill="none"/><path d="M160 1040 v10 m-18 0 h36 m-29 8 h22 m-16 8 h10" stroke="#263b50" stroke-width="3" fill="none"/><text x="420" y="795" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">U1B non usato: pin 5 → GND, pin 6 → VREF, pin 7 libero.</text><text x="420" y="835" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">C1 = 100 nF e C2 = 10 µF / 16 V fra +5V e GND, vicino a U1.</text><text x="420" y="875" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">Tutte le reti GND sono comuni. VBENCH non è il pin VIN ESP32.</text><text x="420" y="915" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">Soglia nominale: K ≈ 0,4875 × VBENCH. UART: 10400, 8N1.</text><text x="420" y="955" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">Stessi nomi di rete = connessione elettrica; nessuna piedinatura auto.</text><text x="420" y="995" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">Componenti e connessioni complete: kline-autocostruita.md.</text><text x="420" y="1035" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="700">Calcoli DC superati; dinamica, guasti ed EMC NON collaudati.</text><rect x="25" y="25" width="1750" height="1270" fill="none" stroke="#172b42" stroke-width="2"/><rect x="650" y="1120" width="1125" height="175" fill="white" stroke="#172b42" stroke-width="2"/><path d="M650 1170 H1775 M650 1225 H1775 M1190 1170 V1295 M1420 1170 V1295" stroke="#263b50" stroke-width="3" fill="none"/><text x="675" y="1155" font-family="Arial,sans-serif" font-size="27" fill="#172b42" font-weight="700">Cruscotto C3+AI — Data Logger</text><text x="675" y="1205" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="700">K-line discreta, schema elettrico banco</text><text x="1210" y="1205" font-family="Arial,sans-serif" font-size="23" fill="#172b42" font-weight="700">REV. A</text><text x="1440" y="1205" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="400">18/10/2026</text><text x="675" y="1260" font-family="Arial,sans-serif" font-size="22" fill="#172b42" font-weight="400">C3AI-DL-KL-001 · Foglio 1/1</text><text x="1210" y="1260" font-family="Arial,sans-serif" font-size="18" fill="#172b42" font-weight="700">NON VALIDATO</text><text x="1440" y="1260" font-family="Arial,sans-serif" font-size="20" fill="#172b42" font-weight="700">SOLO BANCO</text></svg>