#172b42" font-weight="400">TX_INV basso = Q1 spento = linea rilasciata.</text><text x="85" y="585" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">UART TX invertita; RX normale. Nessun optoisolamento.</text><text x="85" y="615" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="400">JP1 chiuso solo per banco; pull-up auto da definire.</text><text x="970" y="175" font-family="Arial,sans-serif" font-size="26" fill="#172b42" font-weight="700">B · Ricezione a soglia proporzionale</text><text x="975" y="320" font-family="Arial,sans-serif" font-size="21" fill="#172b42" font-weight="700">K_BENCH</text><path d="M980 280 H1060" stroke="#263b50" stroke-width="3" fill="none"/><path d="M1060 280 h15 m65 0 h15" stroke="#263b50" stroke-width="3" fill="none"/><rect x="1075" y="270" width="65" height="20" fill="white" stroke="#263b50" stroke-width="3"/><text x="1070" y="240" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">R4</text><text x="1064" y="262" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">68 kΩ</text><path d="M1155 280 H1300" stroke="#263b50" stroke-width="3" fill="none"/><circle cx="1215" cy="280" r="5" fill="#263b50"/><path d="M1215 280 V350" stroke="#263b50" stroke-width="3" fill="none"/><path d="M1215 350 v15 m0 50 v15" stroke="#263b50" stroke-width="3" fill="none"/><rect x="1205" y="365" width="20" height="50" fill="white" stroke="#263b50" stroke-width="3"/><text x="1120" y="384" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">R5</text><text x="1120" y="410" font-family="Arial,sans-serif" font-size="19" fill="#172b42" font-weight="400">10 kΩ</text><path d="M1215 430 V455" stroke="#263b50" stroke-width="3" fill="none"/><path d="M1215 455 v10 m-18 0 h36 m-29 8 h22 m-16 8 h10" stroke="#263b50" stroke-width="3" fill="none"/><path d="M1300 240 L1300 370 L1430 305 Z" fill="#eef5fa" stroke="#263b50" stroke-width="3"/><text x="1