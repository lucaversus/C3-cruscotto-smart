[platformio]
default_envs = esp32-8048s050-ui-test

[env:esp32-8048s050-ui-test]
; HW-DASH-DISPLAY, pinout verificato DSP-M001. Dati simulati, nessun ingresso auto.
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -I$PROJECT_DIR/../common/include -I$PROJECT_INCLUDE_DIR -DLV_CONF_INCLUDE_SIMPLE
  -Wall -Wextra -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = lvgl/lvgl@8.3.11
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
