[platformio]
default_envs = esp32-8048s050-speak-test

[env:esp32-8048s050-speak-test]
; HW-DASH-DISPLAY: tono di prova su IO17/IO18 per identificare U1 (P6 Speak).
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Seriale tramite CH340 (COM4), non USB nativo: GPIO19/20 restano liberi.
build_flags = -I$PROJECT_DIR/../common/include -Wall -Wextra -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
