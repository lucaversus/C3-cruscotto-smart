[platformio]
default_envs = esp32-8048s050-ui-idf

[env:esp32-8048s050-ui-idf]
; HW-DASH-DISPLAY su ESP-IDF 5.5 (D-037): doppio framebuffer sincronizzato, dati simulati.
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags = -I$PROJECT_DIR/../common/include -I$PROJECT_INCLUDE_DIR -DLV_CONF_INCLUDE_SIMPLE
lib_deps = lvgl/lvgl@8.3.11
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
