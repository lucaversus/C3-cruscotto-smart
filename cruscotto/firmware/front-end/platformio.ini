[platformio]
default_envs = esp32-hw394-front-end

[env:esp32-hw394-front-end]
; Front-end del cruscotto (D-029) su HW-ESP32 a banco: trame fe_link verso l'S3 su UART1
; (TX GPIO25 -> S3 P2 IO11, RX GPIO33 <- S3 P2 IO12), per ora con dati simulati.
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
build_unflags = -std=gnu++11
build_flags = -std=gnu++14 -Wall -Wextra -I$PROJECT_DIR/../common/include
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
